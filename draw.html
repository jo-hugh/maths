<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎲 課堂抽籤｜互動教學</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;background:#f4f6fa;color:#222}
  header{background:#2b4c7e;color:#fff;padding:16px 20px}
  header h1{margin:0 0 6px;font-size:1.5rem}
  header p{margin:0;font-size:.95rem}
  header a{color:#ffd966;text-decoration:none;margin-left:8px}
  main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  @media(max-width:760px){main{grid-template-columns:1fr}}
  section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  section h2{margin:0 0 12px;font-size:1.15rem}
  label{display:block;font-weight:600;margin:10px 0 4px}
  .req{color:#d33}
  input[type=text],textarea{width:100%;padding:8px;border:1px solid #bbb;border-radius:8px;font-size:1rem}
  textarea{min-height:200px;resize:vertical}
  small{color:#666}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  button{border:0;border-radius:8px;padding:8px 14px;font-size:1rem;cursor:pointer;background:#e3e8f0}
  button.primary{background:#2b4c7e;color:#fff}
  button.big{font-size:1.3rem;padding:12px 24px}
  button.danger{background:#f8d7da}
  button:disabled{opacity:.45;cursor:not-allowed}
  #current{font-size:2.6rem;font-weight:700;text-align:center;min-height:70px;margin:8px 0;color:#2b4c7e}
  #hint{text-align:center;color:#777;margin-bottom:8px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .stat{background:#f0f3f8;border-radius:8px;padding:8px;text-align:center}
  .stat b{display:block;font-size:1.4rem}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{padding:6px 8px;border-bottom:1px solid #e3e3e3;text-align:left}
  tr.drawn{background:#fffbe6}
  td.num{width:60px;text-align:center;font-weight:700}
  select.hand{padding:4px 6px;border-radius:6px;border:1px solid #bbb;font-size:1rem}
  .full{grid-column:1 / -1}
  #msg{margin-top:8px;min-height:1.2em;color:#2b7a2b}
  footer{text-align:center;color:#888;padding:16px;font-size:.9rem}
</style>
</head>
<body>
<header>
  <h1>🎲 課堂抽籤・回答問題紀錄</h1>
  <p>輸入名單 → 逐一抽籤（抽中者不會重複）→ 選擇舉手次數（最多 4 次）→ 下課送出紀錄　｜<a href="index.html">⬅ 返回目錄</a></p>
</header>

<main>
  <!-- 📋 課堂資料及名單 -->
  <section>
    <h2>📋 課堂資料及名單</h2>
    <label>班別 <span class="req">*</span></label>
    <input type="text" id="cls" placeholder="例：3A">
    <label>課題（選填）</label>
    <input type="text" id="topic" placeholder="例：第五課 分數加減">
    <label>學生姓名（每行一個）</label>
    <textarea id="names" placeholder="陳大文&#10;李小明&#10;..."></textarea>
    <small>貼上或輸入後名單會即時更新；重複姓名只會保留一個。資料會自動暫存在此瀏覽器。</small>
    <div class="btns">
      <button id="btnSort">🔤 排序名單</button>
      <button id="btnClearAll" class="danger">🗑 全部清除</button>
    </div>
  </section>

  <!-- 🎯 抽籤 -->
  <section>
    <h2>🎯 抽籤</h2>
    <div id="current">—</div>
    <div id="hint">按「抽籤」開始</div>
    <div class="btns" style="justify-content:center">
      <button id="btnDraw" class="primary big">🎲 抽籤</button>
      <button id="btnUndo">↩ 復原上一次</button>
      <button id="btnReset">🔄 重設抽籤</button>
    </div>
    <div class="stats">
      <div class="stat">總人數<b id="stTotal">0</b></div>
      <div class="stat">已抽中<b id="stDrawn">0</b></div>
      <div class="stat">未抽<b id="stLeft">0</b></div>
      <div class="stat">✋ 舉手<b id="stHand">0</b><small id="stHandTimes">共 0 次</small></div>
    </div>
    <table>
      <thead><tr><th class="num">抽中</th><th>姓名</th><th>✋ 舉手次數</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <!-- 📤 送出課堂紀錄 -->
  <section class="full">
    <h2>📤 送出課堂紀錄</h2>
    <label>備註（選填）</label>
    <input type="text" id="note" placeholder="例：本節進度、特別事項">
    <div class="btns">
      <button id="btnSubmit" class="primary">✔ 送出紀錄至 Google 試算表</button>
      <button id="btnCopy">📋 複製摘要</button>
    </div>
    <small>送出內容：班別、課題、日期時間、全部名單、抽中順序、舉手名單（含次數）、備註。</small>
    <div id="msg"></div>
  </section>
</main>
<footer>單元教學互動網站｜課堂抽籤・舉手紀錄</footer>

<script>
// ====== 設定 ======
const SHEET_URL = "請貼上你原本的 Google Apps Script 網址";
const MAX_HAND = 4;                 // 舉手次數上限
const KEY = "drawState_v2";

// ====== 狀態 ======
let state = { cls:"", topic:"", note:"", students:[], drawn:[], hands:{} };
// hands: { 姓名: 0~4 }

const $ = id => document.getElementById(id);

// ====== 儲存 / 載入 ======
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) state = Object.assign(state, s); }catch(e){}
  $("cls").value = state.cls; $("topic").value = state.topic; $("note").value = state.note;
  $("names").value = state.students.join("\n");
}

// ====== 名單 ======
function parseNames(){
  const seen = new Set(), list = [];
  $("names").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(n=>{
    if(!seen.has(n)){ seen.add(n); list.push(n); }
  });
  state.students = list;
  state.drawn = state.drawn.filter(n=>seen.has(n));
  Object.keys(state.hands).forEach(n=>{ if(!seen.has(n)) delete state.hands[n]; });
  save(); render();
}

function sortNames(){
  state.students.sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  $("names").value = state.students.join("\n");
  save(); render();
}

function clearAll(){
  if(!confirm("確定清除班別、課題、名單及所有抽籤／舉手紀錄？")) return;
  state = { cls:"", topic:"", note:"", students:[], drawn:[], hands:{} };
  localStorage.removeItem(KEY);
  ["cls","topic","note","names"].forEach(id=>$(id).value="");
  $("current").textContent="—"; $("hint").textContent="按「抽籤」開始";
  render();
}

// ====== 抽籤 ======
function draw(){
  const left = state.students.filter(n=>!state.drawn.includes(n));
  if(!left.length){ $("hint").textContent="所有同學已抽完 🎉"; return; }
  const pick = left[Math.floor(Math.random()*left.length)];
  state.drawn.push(pick);
  $("current").textContent = pick;
  $("hint").textContent = `第 ${state.drawn.length} 位抽中`;
  save(); render();
}

function undo(){
  if(!state.drawn.length) return;
  state.drawn.pop();
  const last = state.drawn[state.drawn.length-1];
  $("current").textContent = last || "—";
  $("hint").textContent = last ? `已復原，目前第 ${state.drawn.length} 位` : "按「抽籤」開始";
  save(); render();
}

function resetDraw(){
  if(!confirm("重設抽籤順序及舉手次數？（名單會保留）")) return;
  state.drawn = []; state.hands = {};
  $("current").textContent="—"; $("hint").textContent="按「抽籤」開始";
  save(); render();
}

// ====== 舉手次數 ======
function setHand(name, val){
  val = Math.max(0, Math.min(MAX_HAND, parseInt(val)||0));
  if(val===0) delete state.hands[name]; else state.hands[name]=val;
  save(); renderStats();
}

// ====== 畫面 ======
function renderStats(){
  const handNames = Object.keys(state.hands);
  const times = handNames.reduce((s,n)=>s+state.hands[n],0);
  $("stTotal").textContent = state.students.length;
  $("stDrawn").textContent = state.drawn.length;
  $("stLeft").textContent  = state.students.length - state.drawn.length;
  $("stHand").textContent  = handNames.length;
  $("stHandTimes").textContent = `共 ${times} 次`;
  $("btnDraw").disabled = state.drawn.length >= state.students.length;
  $("btnUndo").disabled = !state.drawn.length;
}

function render(){
  renderStats();
  const tb = $("tbody"); tb.innerHTML = "";
  state.students.forEach(n=>{
    const idx = state.drawn.indexOf(n);
    const tr = document.createElement("tr");
    if(idx>=0) tr.className="drawn";
    const opts = Array.from({length:MAX_HAND+1},(_,i)=>
      `<option value="${i}" ${(state.hands[n]||0)===i?"selected":""}>${i===0?"— 未舉手":"✋ "+i+" 次"}</option>`).join("");
    tr.innerHTML = `<td class="num">${idx>=0?idx+1:"—"}</td><td>${n}</td>
      <td><select class="hand" data-name="${n}">${opts}</select></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll("select.hand").forEach(sel=>{
    sel.onchange = e => setHand(e.target.dataset.name, e.target.value);
  });
}

// ====== 紀錄輸出 ======
function now(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function handList(){
  return state.students.filter(n=>state.hands[n]).map(n=>`${n}（${state.hands[n]}次）`);
}
function buildRecord(){
  return {
    班別: state.cls, 課題: state.topic, 日期時間: now(),
    全部名單: state.students.join("、"),
    抽中順序: state.drawn.map((n,i)=>`${i+1}.${n}`).join(" "),
    舉手名單: handList().join("、"),
    舉手總次數: Object.values(state.hands).reduce((s,v)=>s+v,0),
    舉手次數明細: state.hands,
    備註: state.note
  };
}
function buildSummary(){
  const r = buildRecord(), hn = handList();
  return [
    "【課堂抽籤紀錄】",
    `班別：${r.班別}`, `課題：${r.課題||"—"}`, `日期時間：${r.日期時間}`,
    `全部名單（${state.students.length}人）：${r.全部名單}`,
    `抽中順序（${state.drawn.length}人）：${r.抽中順序||"—"}`,
    `舉手名單（${hn.length}人，共${r.舉手總次數}次）：${r.舉手名單||"—"}`,
    `備註：${r.備註||"—"}`
  ].join("\n");
}

async function submit(){
  if(!state.cls.trim()){ alert("請先填寫班別。"); $("cls").focus(); return; }
  if(!state.students.length){ alert("名單為空。"); return; }
  $("btnSubmit").disabled = true; $("msg").textContent="傳送中…";
  try{
    await fetch(SHEET_URL,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain"},body:JSON.stringify(buildRecord())});
    $("msg").textContent = "✅ 已送出紀錄（" + now() + "）";
  }catch(e){ $("msg").textContent="❌ 送出失敗："+e.message; }
  $("btnSubmit").disabled = false;
}

async function copySummary(){
  try{ await navigator.clipboard.writeText(buildSummary()); $("msg").textContent="📋 已複製摘要"; }
  catch(e){ prompt("請手動複製：", buildSummary()); }
}

// ====== 事件 ======
$("names").addEventListener("input", parseNames);
["cls","topic","note"].forEach(id=>$(id).addEventListener("input",e=>{ state[id]=e.target.value; save(); }));
$("btnSort").onclick=sortNames; $("btnClearAll").onclick=clearAll;
$("btnDraw").onclick=draw; $("btnUndo").onclick=undo; $("btnReset").onclick=resetDraw;
$("btnSubmit").onclick=submit; $("btnCopy").onclick=copySummary;

load(); render();
</script>
</body>
</html>
